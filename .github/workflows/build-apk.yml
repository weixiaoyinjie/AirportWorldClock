
name: AirportWorldClock APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -e
          if [ ! -f settings.gradle ]; then
            ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo 'ERROR: Source ZIP not found'
              exit 1
            fi
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            SETTINGS=$(find extracted -type f -name settings.gradle -print -quit)
            if [ -z "$SETTINGS" ]; then
              echo 'ERROR: settings.gradle not found'
              exit 1
            fi
            cp -a "$(dirname "$SETTINGS")"/. .
          fi
          test -f app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo 'ERROR: sdkmanager not found'
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirportWorldClock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
